<script>
const SUPABASE_URL='https://xjnkfwykezzcxmmpsrgi.supabase.co';

let sb=null,cloudSession=null,cloudTimer=0,cloudBooted=false;
const cloudStatus=t=>{const e=document.getElementById('cloudStatus');if(e)e.textContent=t};
const KEY='trip-planner-v1';
const LOCAL_TEST=new URLSearchParams(location.search).get('localtest')==='1';
const uid=()=>Math.random().toString(36).slice(2,9);
const blank=()=>({title:'',start:'',cur:0,days:[{name:'',items:[]}]});
let S=blank(),RO=true;
const okS=p=>p&&Array.isArray(p.days)&&p.days.length;
try{const p=JSON.parse(document.getElementById('data').textContent||'null');if(okS(p))S=p}catch(e){}
let SHARE_TOKEN='',SHARE_ROLE='',EMAIL_ROLE='',shareTimer=0,sharePoll=0,shareDirty=false,pendingLocal=null,shareUpdated='';
const save=()=>{if(RO)return;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){flash('瀏覽器儲存空間不足，請減少圖片')}
  if(LOCAL_TEST){cloudStatus('測試模式：修改只保存在這個瀏覽器，不會同步雲端。');return}
  if(SHARE_TOKEN&&sb&&['owner','editor'].includes(SHARE_ROLE)){shareDirty=true;clearTimeout(shareTimer);shareTimer=setTimeout(cloudShareSaveNow,650)}
  else if(cloudSession&&sb){clearTimeout(cloudTimer);cloudTimer=setTimeout(cloudSaveNow,700)}
  else cloudStatus(LOCAL_TEST?'測試模式：修改只保存在這個瀏覽器，不會同步雲端。':'尚未使用共同編輯分享連結，這次修改只存在此裝置。')
};
async function cloudShareSaveNow(){
  if(!SHARE_TOKEN||!sb||!['owner','editor'].includes(SHARE_ROLE)||!shareDirty)return;
  const snapshot=JSON.parse(JSON.stringify(S));shareDirty=false;cloudStatus('正在同步到雲端…');
  try{const {data,error}=await sb.rpc('trip_share_save',{p_token:SHARE_TOKEN,p_data:snapshot});if(error)throw error;shareUpdated=data?.updated_at||new Date().toISOString();cloudStatus('已同步到雲端 · '+new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'}));}
  catch(e){shareDirty=true;cloudStatus('雲端同步失敗：'+(e.message||'請重新整理'));flash('同步失敗，請保留此頁不要關閉',5000)}
}
async function pollSharedState(){
  if(!SHARE_TOKEN||!sb||document.hidden)return;
  try{const {data,error}=await sb.rpc('trip_share_get',{p_token:SHARE_TOKEN});if(error)throw error;
    if(data.updated_at&&data.updated_at!==shareUpdated&&!shareDirty){if(okS(data.data)){S=data.data;shareUpdated=data.updated_at;if(SHARE_ROLE!=='voter')try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}render();cloudStatus('已取得最新共同資料 · '+new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'}));}}
  }catch(e){cloudStatus('同步連線中斷：'+(e.message||'請檢查分享連結'))}
}
function shareUrl(token){return 'https://okinawa-itinerary-two.vercel.app'+location.pathname+'?share='+encodeURIComponent(token)}
function canManageShares(){
  return !!((SHARE_TOKEN&&SHARE_ROLE==='owner')||(!SHARE_TOKEN&&cloudSession&&EMAIL_ROLE==='owner'));
}
async function renderShareManager(){
  const box=document.getElementById('shareManager'),jump=document.getElementById('shareJump');
  const allowed=canManageShares()&&!LOCAL_TEST;
  if(box)box.hidden=!allowed;
  if(jump)jump.hidden=!allowed;
  if(!box||!allowed||!sb)return;
  const byToken=SHARE_TOKEN&&SHARE_ROLE==='owner';
  const {data,error}=byToken
    ?await sb.rpc('trip_share_list',{p_owner_token:SHARE_TOKEN})
    :await sb.rpc('trip_owner_share_list');
  if(error){box.querySelector('[data-share-list]').textContent='無法讀取分享清單：'+error.message;return}
  const rows=Array.isArray(data)?data:[];
  box.querySelector('[data-share-list]').innerHTML=rows.map(x=>'<div class="share-row"><div><b>'+esc(x.label||'未命名分享')+'</b><small>'+({editor:'共同編輯',voter:'願望登記',viewer:'唯讀'}[x.role]||x.role)+' · '+(x.revoked_at?'已撤銷':'使用中')+'</small></div><div class="share-row-actions">'+(!x.revoked_at?'<button class="btn del" data-share-revoke="'+esc(x.id)+'">撤銷</button>':'')+'</div></div>').join('')||'<p class="sub">目前尚未建立給朋友的分享連結。</p>';
}
async function loadShareMode(){
  const params=new URLSearchParams(location.search);let token=params.get('share')||'';
  if(token){SHARE_TOKEN=token;try{localStorage.setItem('trip-share-token',token)}catch(e){}history.replaceState({},'',location.pathname+location.hash);}
  else{try{SHARE_TOKEN=localStorage.getItem('trip-share-token')||''}catch(e){}}
  if(!SHARE_TOKEN)return false;
  const {data,error}=await sb.rpc('trip_share_get',{p_token:SHARE_TOKEN});if(error)throw error;
  SHARE_ROLE=data.role;shareUpdated=data.updated_at||'';S=data.data;RO=!['owner','editor'].includes(SHARE_ROLE);
  try{const raw=localStorage.getItem(KEY);if(raw){const local=JSON.parse(raw);if(okS(local)&&JSON.stringify(local)!==JSON.stringify(S)&&SHARE_ROLE==='owner')pendingLocal=local;}}catch(e){}
  render();cloudStatus(({owner:'管理者',editor:'共同編輯',voter:'願望登記',viewer:'唯讀'}[SHARE_ROLE]||'分享')+'模式 · 雲端資料已載入');
  const login=document.getElementById('cloudLoginBox');if(login)login.hidden=true;
  const manager=document.getElementById('shareManager');if(manager)manager.hidden=SHARE_ROLE!=='owner';
  const jump=document.getElementById('shareJump');if(jump)jump.hidden=SHARE_ROLE!=='owner';
  const migrate=document.getElementById('shareMigrate');if(migrate)migrate.hidden=!pendingLocal;
  if(SHARE_ROLE==='owner')renderShareManager();
  if(sharePoll)clearInterval(sharePoll);sharePoll=setInterval(pollSharedState,4000);
  return true;
}

async function cloudSaveNow(){
  if(!sb||!cloudSession||RO)return;
  cloudStatus('正在保存到雲端…');
  try{
    const {error}=await sb.from('trip_state').upsert({id:'main',data:S,updated_at:new Date().toISOString()},{onConflict:'id'});
    if(error)throw error;
    try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
    cloudStatus('雲端已保存 · '+new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit',second:'2-digit'}));
  }catch(e){
    console.error('Supabase save failed',e);
    cloudStatus('雲端保存失敗：'+(e.message||'請重新登入或稍後重試'));
    flash('雲端保存失敗，請先不要關閉此頁',5000);
  }
}
function applyRO(){
  document.querySelector('main').classList.toggle('ro',RO);
  document.querySelectorAll('main input,main textarea,main select').forEach(x=>x.disabled=RO&&!x.hasAttribute('data-keep'));
}
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const WD=['日','一','二','三','四','五','六'];

/* Shared opening-hours fields for itinerary stops and backup places. */
const HOURS_DAYS=['日','一','二','三','四','五','六'];
function hoursDate(dayIndex){
  if(!S.start||!Number.isInteger(+dayIndex))return '';
  const d=new Date(S.start+'T12:00:00');if(Number.isNaN(d.getTime()))return '';
  d.setDate(d.getDate()+(+dayIndex));
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function hoursInfo(o,dayIndex,time){
  o=o||{};const off=Array.isArray(o.off)?o.off.map(Number):[];
  const closed=Array.isArray(o.closedDates)?o.closedDates:[];
  const date=hoursDate(dayIndex);
  if(date&&closed.includes(date))return {state:'closed',label:'⚠ '+date+' 特殊休館'};
  if(date&&off.includes(new Date(date+'T12:00:00').getDay()))return {state:'closed',label:'⚠ 當天公休（週'+HOURS_DAYS[new Date(date+'T12:00:00').getDay()]+'）'};
  if(o.alwaysOpen)return {state:'open',label:'24 小時開放'};
  if(o.open&&o.close){
    if(time){
      const t=time.slice(0,5),a=o.open,b=o.close;
      const inside=a<=b?(t>=a&&t<b):(t>=a||t<b);
      return inside?{state:'open',label:'✓ 抵達時間在營業時段內'}:{state:'closed',label:'⚠ 預計 '+t+' 抵達，超出營業時間 '+a+'～'+b};
    }
    return {state:'info',label:'營業 '+o.open+'～'+o.close+(date?' · 當天未設定公休':'')};
  }
  return {state:'unknown',label:'尚未設定營業時間'};
}
function hoursSummary(o){return o.alwaysOpen?'24 小時開放':(o.open&&o.close?'營業 '+o.open+'～'+o.close:'營業時間未設定');}
function hoursStatusHtml(o,di,time){
  const h=hoursInfo(o,di,time);
  return '<span class="hours-status '+h.state+'">'+esc(h.label)+'</span>';
}

function ticketSummary(o){
  o=o||{};
  let summary='尚未設定';
  if(o.ticketType==='free')summary='免費入場';

async function estimate(idx){

    (Array.isArray(r)?r:[]).forEach(o=>{const x=d.items[o.i];if(x&&segs.some(s=>s.i===o.i)&&Number.isFinite(+o.minutes))x.min=Math.round(+o.minutes)});

async function refreshWishVotes(){
  if(V!=='wish'||!sb)return;
  const ownerByEmail=!SHARE_TOKEN&&!!cloudSession&&EMAIL_ROLE==='owner';
  if(!SHARE_TOKEN&&!ownerByEmail)return;
  try{
    const {data,error}=SHARE_TOKEN
      ?await sb.rpc('trip_wish_votes_get',{p_token:SHARE_TOKEN})
      :await sb.rpc('trip_owner_wish_votes_get');
    if(error)throw error;
    WEB_WISH_VOTES=Array.isArray(data)?data:[];
    const me=wishIdentity();
    document.querySelectorAll('[data-wvote]').forEach(b=>{
      const votes=WEB_WISH_VOTES.filter(v=>v.item_id===b.dataset.wvote);
      const mine=votes.some(v=>v.voter_id===me.id);
      b.textContent=mine?'♥ 我想買':'♡ 我也想買';
      b.setAttribute('aria-pressed',String(mine));
    });
    document.querySelectorAll('[data-wvlabel]').forEach(l=>{
      const votes=WEB_WISH_VOTES.filter(v=>v.item_id===l.dataset.wvlabel);
      const names=votes.map(v=>ownerByEmail?v.voter_name:(v.voter_id===me.id?'我':v.voter_name));
      l.textContent=votes.length?'想買 '+votes.length+' 人：'+names.join('、'):'還沒有人標記想買';
    });
  }catch(e){
    console.error('Wish registration list failed',e);
    document.querySelectorAll('[data-wvlabel]').forEach(l=>l.textContent='暫時無法取得登記名單，請重新登入或稍後再試');
  }
}
async function toggleWebWishVote(itemId){
  if(WEB_WISH_BUSY)return;
  if(!SHARE_TOKEN||!['owner','editor','voter'].includes(SHARE_ROLE)){flash('此分享權限不能登記願望');return}
  WEB_WISH_BUSY=true;
  try{const me=wishIdentity();if(!me.name){const n=prompt('輸入你的旅伴名稱，讓大家知道是誰想買：');if(!n||!n.trim()){WEB_WISH_BUSY=false;return}me.name=n.trim().slice(0,40);try{localStorage.setItem('wish-voter-name',me.name)}catch(e){}}
    const mine=WEB_WISH_VOTES.some(v=>v.item_id===itemId&&v.voter_id===me.id);
    const {error}=mine?await sb.rpc('trip_wish_vote_delete',{p_token:SHARE_TOKEN,p_item_id:itemId,p_voter_id:me.id}):await sb.rpc('trip_wish_vote_add',{p_token:SHARE_TOKEN,p_item_id:itemId,p_voter_id:me.id,p_voter_name:me.name});
    if(error)throw error;await refreshWishVotes();

}

function applyCollectionSearch(kind){
  const id=kind==='wish'?'wish-search':'dine-search';
  const q=(document.getElementById(id)?.value||'').trim().toLowerCase();
  const data=kind==='wish'?S.wish:S.dine;
  const list=oth.querySelector('.items');
  if(!list)return;
  let shown=0;
  [...list.children].forEach(li=>{
    const idx=Number(li.dataset.i);
    if(!Number.isInteger(idx)||!data[idx])return;
    const o=data[idx];
    const hay=(kind==='wish'?[o.t,o.cat,o.note,o.price]:[o.name,o.cat,dineMeals(o).join(' '),dineKind(o),o.addr,o.note,o.open,o.close,o.open2,o.close2]).join(' ').toLowerCase();
    li.hidden=!!q&&!hay.includes(q);
    if(!li.hidden)shown++;
  });
  let empty=oth.querySelector('[data-collection-no-results]');
  if(!empty){
    empty=document.createElement('li');empty.className='empty';empty.dataset.collectionNoResults='1';empty.textContent='找不到符合條件的項目。';list.appendChild(empty);
  }
  empty.hidden=shown>0||!q;
}
function applyNoticeFilters(){
  const q=(document.getElementById('notice-search')?.value||'').trim().toLowerCase();
  const cat=document.getElementById('notice-filter-cat')?.value||'全部';
  const cards=[...oth.querySelectorAll('[data-notice-card]')];
  let shown=0;
  cards.forEach(card=>{
    const matchCat=cat==='全部'||card.dataset.cat===cat;
    const matchText=!q||(card.dataset.search||'').includes(q);
    card.hidden=!(matchCat&&matchText);if(!card.hidden)shown++;

  if(empty)empty.hidden=shown>0;
}

function distOf(o,i){
  const c=o.lat!=null?{lat:o.lat,lng:o.lng}:COORD[i];if(!ME||!c)return null;
  const r=x=>x*Math.PI/180,dl=r(c.lat-ME.lat),dn=r(c.lng-ME.lng);
  const A=Math.sin(dl/2)**2+Math.cos(r(ME.lat))*Math.cos(r(c.lat))*Math.sin(dn/2)**2;
  return 12742*Math.asin(Math.sqrt(A));
}

function expCalc(){
  const P=S.people,cs=new Set(S.exp.filter(o=>+o.amt).map(o=>o.cur||S.fc));
  const unit=cs.size>1?S.hc:([...cs][0]||S.fc);

  const paid=P.map(()=>0),owed=P.map(()=>0),miss=new Set();let tot=0;
  S.exp.forEach(o=>{const a=+o.amt||0,sp=(o.split||[]).filter(j=>j<P.length),w=+o.who||0;if(!a||!sp.length||w>=P.length)return;

  return `<div class="gal">${L.map((u,j)=>`<img class="gi ${sz}" src="${imgSrc(u)}"${u&&u.startsWith('data:')?'':` data-iid="${u}"`} alt="" data-zoom="${k}:${i}:${j}">`).join('')}<label class="gadd ${sz}">📷<input type="file" accept="image/*" multiple data-img="${k}" data-i="${i}" hidden></label></div>`;
}
function readImg(file,max){return new Promise(res=>{
  const r=new FileReader();
  r.onload=()=>{const im=new Image();
    im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');
      c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
      const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
      res(c.toDataURL('image/jpeg',0.7))};
    im.onerror=()=>res(null);im.src=r.result};
  r.onerror=()=>res(null);r.readAsDataURL(file);
})}

function fltSum(){
  const fmt=v=>{const d=new Date(v);return v&&!isNaN(d)?(d.getMonth()+1)+'/'+d.getDate()+'（'+WD[d.getDay()]+'）'+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'):'未填'};
  const dd=(a,b)=>Math.round((new Date(b.slice(0,10))-new Date(a.slice(0,10)))/864e5);
  const out=S.flt.filter(o=>o.dir!=='ret'&&o.dep),ret=S.flt.filter(o=>o.dir==='ret'&&o.dep);
  if(!out.length||!ret.length)return '填好去程和回程的起飛時間，這裡會顯示倒數並核對日期。';
  const o=out[0],r=ret[ret.length-1],left=Math.ceil((new Date(o.dep)-Date.now())/864e5);
  let h=left>0?`<div class="cd"><b>${left}</b>天後出發</div>`:(left===0?'<div class="cd"><b>今天</b>出發</div>':'<div class="cd">已經出發</div>');
  h+=`<div>去程 ${fmt(o.dep)} 起飛，回程 ${fmt(r.dep)} 起飛</div>`;
  if(r.dep<=o.dep)return h+'<div>回程時間早於去程，請再確認。</div>';

async function loadGeo(){
  const need=stopsOf(S.days[S.cur]).map(s=>s.p).filter((p,i,a)=>a.indexOf(p)===i&&!geoOf(p));
  if(!need.length||mapBusy)return;
  let sm=null;try{sm=window.claude?await claude.use('sample'):null}catch(e){}
  if(!sm)return;
  mapBusy=true;drawMap();
  try{
    const r=await sm.json('你是地理助理。目的地區域：'+(S.dest||'未指定')+'。請估算下列每個地點的緯度與經度（小數 4 位）。只回傳 JSON 陣列，格式 [{"p":"原名稱","lat":數字,"lng":數字}]，p 必須和輸入完全相同，不要其他文字。\n'+JSON.stringify(need));
    (Array.isArray(r)?r:[]).forEach(z=>{if(need.includes(z.p)&&isFinite(z.lat)&&isFinite(z.lng)){const g={lat:+z.lat,lng:+z.lng};if(RO)GEOV[z.p]=g;else{S.geo=S.geo||{};S.geo[z.p]=g}}});
    if(!RO)save();
  }catch(e){}

}
function drawMap(){
  const st=stopsOf(S.days[S.cur]),box=$('mapsvg'),by={},seq=[];
  st.forEach((s,i)=>{const g=geoOf(s.p);if(!g)return;(by[s.p]=by[s.p]||{p:s.p,g,n:[]}).n.push(i+1);seq.push(g)});
  const pins=Object.values(by);PINS=pins;
  $('mapcap').textContent=pins.length?'點地圖上的號碼可看地點名稱（示意圖，位置為估算）':'';
  if(!pins.length){box.innerHTML='<div class="mapph">'+(st.length?(mapBusy?'地圖示意圖載入中…':'地圖示意圖尚未建立'):'填入地點後，這裡會顯示地圖示意圖。')+'</div>';return}
  const W=340,H=240,pad=24,la=pins.map(x=>x.g.lat),lo=pins.map(x=>x.g.lng);

const GROUPS={plan:['title','start','end','dest','days'],flt:['flt'],dine:['dine'],pack:['pack','packCats'],wish:['wish'],exp:['exp','people'],tax:['taxFree'],notice:['notices'],fx:['fc','hc','rate','rates']};
const canon=o=>JSON.stringify(o,(k,v)=>v&&typeof v==='object'&&!Array.isArray(v)?Object.keys(v).sort().reduce((a,x)=>(a[x]=v[x],a),{}):v);
const pickG=g=>{const o={};GROUPS[g].forEach(k=>{if(S[k]!==undefined)o[k]=S[k]});return o};
let SYNC=false,LAST={},FT2=0,IMG={};
const imgSrc=u=>u&&u.startsWith('data:')?u:(IMG[u]||'');
function paintImgs(){document.querySelectorAll('img[data-iid]').forEach(im=>{const u=IMG[im.dataset.iid];if(u&&im.getAttribute('src')!==u)im.src=u})}
function schedFlush(){if(!SYNC||RO)return;clearTimeout(FT2);FT2=setTimeout(flush,700)}
function shrinkImg(u){return new Promise(res=>{
  const im=new Image();
  im.onload=()=>{let w=im.width,hh=im.height,q=0.7,out=u;
    for(let n=0;n<8;n++){const c=document.createElement('canvas');c.width=Math.max(60,Math.round(w));c.height=Math.max(60,Math.round(hh));
      const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
      out=c.toDataURL('image/jpeg',q);if(out.length<170000)break;w*=0.8;hh*=0.8;q=Math.max(0.5,q-0.05)}
    res(out)};
  im.onerror=()=>res(null);im.src=u;
})}
async function moveImgs(g){
  for(const k of GROUPS[g]){const L=S[k];if(!Array.isArray(L))continue;
    for(const o of L){if(!o||!Array.isArray(o.imgs))continue;
      for(let j=0;j<o.imgs.length;j++){let u=o.imgs[j];
        if(u&&u.startsWith('data:')){
          if(u.length>170000)u=await shrinkImg(u);
          const id=uid();
          try{if(!u)throw 0;await DB.doc('img/'+id).set({d:u});IMG[id]=u;o.imgs[j]=id}catch(e){o.imgs.splice(j,1);j--;flash('有一張照片無法同步，已略過',4000)}}}}}
}
async function flush(){
  if(!DB||RO)return;
  for(const g of Object.keys(GROUPS)){
    await moveImgs(g);
    const c=canon(pickG(g));
    if(c===LAST[g])continue;
    LAST[g]=c;
    try{const body=JSON.parse(JSON.stringify({d:pickG(g),by:UID,t:Date.now()}));await DB.doc('trip/'+g).set(body)}catch(e){LAST[g]=undefined;flash('同步失敗：'+g+'（'+((e&&e.code)||'未知原因')+'，約 '+Math.round(JSON.stringify(pickG(g)).length/1024)+' KB）',6000)}
  }
}
function deferRender(){const a=document.activeElement;if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&!a.disabled){a.addEventListener('blur',()=>setTimeout(render,80),{once:true});return}render()}
function startSync(){
  SYNC=true;let first=true;
  DB.collection('img').onSnapshot(s=>{let ch=false;s.docs.forEach(d=>{const x=d.data()||{};if(x.d&&IMG[d.id]!==x.d){IMG[d.id]=x.d;ch=true}});if(ch)paintImgs()},()=>{});
  DB.collection('trip').onSnapshot(s=>{
    const got={};s.docs.forEach(d=>{got[d.id]=d.data()||{}});
    let ch=false;
    for(const g of Object.keys(GROUPS)){const x=got[g];if(!x||!x.d)continue;
      if(canon(x.d)===LAST[g])continue;
      if(!RO&&LAST[g]!==undefined&&canon(pickG(g))!==LAST[g])continue;
      Object.assign(S,x.d);LAST[g]=canon(pickG(g));ch=true}
    if(ch)deferRender();
    if(first){first=false;if(!RO)schedFlush()}
  },()=>{flash('無法連線到雲端同步',4000)});
}

async function cloudApplySession(session){
  cloudSession=session||null;
  EMAIL_ROLE='';
  await renderShareManager();
  if(!cloudSession){
    RO=!LOCAL_TEST;
    let restored=false;
    try{
      const raw=localStorage.getItem(KEY);
      if(raw){const local=JSON.parse(raw);if(okS(local)){S=local;restored=true}}
    }catch(e){console.warn('Local trip cache could not be restored',e)}
    render();
    cloudStatus(LOCAL_TEST?'測試模式：可測試新增、編輯與排入行程；資料只保存在此瀏覽器，不會同步雲端。':(restored?'尚未登入：目前顯示此裝置的暫存資料（唯讀），登入後即可讀取最新雲端資料。':'尚未登入：請使用管理者或同行分享連結進入，才能讀取共同資料。'));
    const b=document.getElementById('cloudLogin');if(b){b.textContent=LOCAL_TEST?'測試模式（不登入）':'登入並同步';b.disabled=LOCAL_TEST}
    const em=document.getElementById('cloudEmail');if(em&&LOCAL_TEST)em.disabled=true;
    return;
  }
  const email=(cloudSession.user&&cloudSession.user.email||'').toLowerCase();
  try{
    const {data:member,error:memberError}=await sb.from('trip_members').select('role').ilike('email',email).maybeSingle();
    if(memberError)throw memberError;
    if(!member||!['owner','editor'].includes(member.role)){
      RO=true;render();cloudStatus('已登入 '+email+'，但尚未獲得編輯權限。');
      const b=document.getElementById('cloudLogin');if(b)b.textContent='登出';
      return;
    }
    EMAIL_ROLE=member.role;
    RO=false;
    const {data:row,error:loadError}=await sb.from('trip_state').select('data,updated_at').eq('id','main').maybeSingle();
    if(loadError)throw loadError;
    if(row&&row.data&&okS(row.data)){
      S=row.data;
      try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
      render();
      cloudStatus('雲端資料已載入 · '+email);
    }else{
      try{const raw=localStorage.getItem(KEY);if(raw){const local=JSON.parse(raw);if(okS(local))S=local}}catch(e){}
      render();
      await cloudSaveNow();
    }
    const b=document.getElementById('cloudLogin');if(b)b.textContent='登出';
    await renderShareManager();
  }catch(e){
    console.error('Supabase init failed',e);
    RO=true;render();cloudStatus('雲端連線失敗：'+(e.message||'請稍後重試'));
  }
}

function allText(){
  const M={walking:'步行',transit:'大眾運輸',driving:'開車'},L=[];

  L.push('目的地：'+(S.dest||'')+'　出發日：'+(S.start||'')+'　回國日：'+(S.end||''));

  S.days.forEach((d,i)=>{
    L.push('第 '+(i+1)+' 天 '+dateOf(i)+(d.name?' '+d.name:''));
    d.items.forEach((it,k)=>{
      L.push('  '+(it.time||'--:--')+' '+(it.name||'')+(it.place&&it.place!==it.name?'（'+it.place+'）':'')+(it.note?'　'+it.note:''));

    });

  });
  L.push('【機票】');
  (S.flt||[]).forEach(o=>L.push((o.dir==='ret'?'回程 ':'去程 ')+(o.no||'')+'　'+(o.from||'')+' → '+(o.to||'')+'　起飛 '+(o.dep||'').replace('T',' ')+'　抵達 '+(o.arr||'').replace('T',' ')+(o.pnr?'　訂位代號 '+o.pnr:'')+(o.note?'　'+o.note:'')));
  L.push('');L.push('【備選餐廳】');
  (S.dine||[]).forEach(o=>L.push('・'+(o.name||'')+'（'+(o.cat||'')+'）'+(o.addr?' 地址：'+o.addr:'')+(o.open||o.close?' 營業 '+(o.open||'?')+'–'+(o.close||'?'):'')+((o.off||[]).length?' 公休：週'+o.off.map(j=>WD[j]).join('、'):'')+(o.note?' '+o.note:'')));
  L.push('');L.push('【行李】');
  const C=S.packCats||[];
  [...C,''].forEach(c=>{const A=(S.pack||[]).filter(o=>c===''?!C.includes(o.cat):o.cat===c);if(!A.length)return;L.push((c||'未分類')+'：');A.forEach(o=>L.push('  '+(o.done?'[x] ':'[ ] ')+(o.t||'')))});
  L.push('');L.push('【願望清單】');
  (S.wish||[]).forEach(o=>L.push((o.done?'[x] ':'[ ] ')+(o.t||'')+(o.price?'　'+o.price+' '+(o.cur||S.fc):'')+(o.cat?'　'+o.cat:'')+(o.note?'　'+o.note:'')));
  L.push('');L.push('【購物退稅】');

  L.push('');L.push('【注意事項】');

  L.push('');L.push('【旅費】');
