<!DOCTYPE html>
<html lang="zh-Hant" style="--dc: #C9A9A6;"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>沖繩5日</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&amp;display=swap">
<style>
:root{color-scheme:light;--dc:#C9A9A6;--bg:#F5F3EF;--card:#fff;--ink:#454B4E;--sub:#858A88;--line:#DCD8D1;--acc:var(--dc);--accink:#33302f;--danger:#B0625A;--ft:#F1EFEA;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}
main{max-width:680px;margin:0 auto;padding:20px 16px 60px}
input,textarea,button{font:inherit;color:inherit}
input,textarea{width:100%;background:transparent;border:1px solid transparent;border-radius:8px;padding:6px 8px}
input:hover,textarea:hover{border-color:var(--line)}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
textarea{resize:vertical;min-height:2.4em;color:var(--sub);font-size:14px}
.title{font:900 28px/1.3 "Noto Serif TC",serif;padding:4px 8px}
.meta{display:flex;gap:10px;align-items:center;color:var(--sub);font-size:14px;margin:2px 0 14px}
.meta input{width:auto;border-color:var(--line)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:thin}
.tab{flex:none;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 14px;cursor:pointer;text-align:center;line-height:1.3}
.tab small{display:block;color:var(--sub);font-size:12px}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab[aria-selected="true"] small{color:var(--bg);opacity:.75}
.tab.add{border-style:dashed;color:var(--sub)}
.day{background:color-mix(in srgb,var(--dc) 12%,var(--card));border:2px solid var(--dc);border-radius:14px;padding:14px}
.dayhead{display:flex;gap:8px;align-items:baseline;margin-bottom:6px}
.dayhead b{font:900 20px "Noto Serif TC",serif;white-space:nowrap}
.dayhead input{font-size:18px;font-weight:600}
.items{list-style:none;margin:0;padding:0}
.item{display:grid;grid-template-columns:96px 1fr;gap:4px 10px;padding:12px 0;border-top:1px solid var(--line)}
.item .time{font-weight:700;border-color:var(--line);background:var(--ft);padding:6px}
.item .name{font-weight:600}
.item .place{font-size:14px;color:var(--sub)}
.item .full{grid-column:2}
.tools{grid-column:2;display:flex;gap:6px}
.btn{border:1px solid var(--line);background:var(--ft);border-radius:8px;padding:4px 10px;cursor:pointer;font-size:14px}
.btn:hover{border-color:var(--sub)}
.btn.del,.btn.danger{color:var(--danger)}
.btn.main{background:var(--acc);color:var(--accink);border-color:var(--acc);font-weight:700}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.empty{color:var(--sub);padding:18px 4px;text-align:center}
.foot{margin-top:18px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;color:var(--sub);font-size:13px}
.meta{flex-wrap:wrap}.pw{grid-column:2;display:flex;align-items:center;gap:6px}.pw a,.leg a{flex:none;text-decoration:none;font-size:13px}
.leg{list-style:none;display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:2px 0 10px 12px;padding:8px 10px;border:1px dashed var(--line);border-radius:10px;background:var(--ft);font-size:14px;color:var(--sub)}
.leg select,.leg input{width:auto;border-color:var(--line);padding:3px 6px;background:var(--card)}.leg input{width:64px}
.total{margin-top:10px;color:var(--sub);font-size:14px;font-weight:600}.total:empty{display:none}
#msg:not(:empty){position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:14px;z-index:5;max-width:90%}
input:disabled,textarea:disabled,select:disabled{opacity:1;color:inherit;-webkit-text-fill-color:currentColor}
.ro input,.ro textarea,.ro select{border-color:transparent!important;background:transparent!important;appearance:none;-webkit-appearance:none;resize:none}
.ro ::placeholder{color:transparent}.ro textarea:placeholder-shown{display:none}
.ro .bar,.ro .tools,.ro .leg button,.ro #reset,.ro .empty,.ro .tab.add{display:none}
.mapbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 10px;color:var(--sub);font-size:14px}.mapbar a{text-decoration:none}
#nav .tab[aria-selected="true"],#tabs .tab[aria-selected="true"]{color:#33302f;font-weight:700}
#nav .tab[aria-selected="true"]{background:var(--dc);border-color:var(--dc)}
#tabs .tab[data-tab]{border-color:var(--c);background:color-mix(in srgb,var(--c) 22%,#fff)}
#tabs .tab[data-tab][aria-selected="true"]{background:var(--c)}
#tabs .tab[aria-selected="true"] small{color:#33302f}
#day .item .time{background:color-mix(in srgb,var(--dc) 25%,#fff);border-color:transparent}
.leg{border-color:var(--dc)}.item,.row{border-top-color:color-mix(in srgb,var(--dc) 45%,#fff)}
.row{flex-wrap:wrap}.vrow{flex:1 0 100%;display:flex;gap:8px;align-items:center;font-size:14px;color:var(--sub);padding-left:26px}
.warn{font-size:14px;color:var(--danger)}.fl .full input[type=checkbox]{flex:none;width:20px}
.fx select{width:auto;border-color:var(--line);background:var(--card)}.ro select[data-keep]{border-color:var(--line)!important;appearance:auto;-webkit-appearance:menulist}
.row select{width:auto;max-width:7em;border-color:var(--line);background:var(--card)}
.grp{margin-top:12px}.gh{display:flex;gap:8px;align-items:center}.gh span{color:var(--sub);flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.chip{display:inline-flex;gap:2px;align-items:center;border:1px solid var(--dc);border-radius:99px;padding:2px 4px 2px 10px;font-size:14px;background:var(--card)}.chip .btn{padding:0 6px;border:0;background:transparent}
.pp{display:inline-flex;gap:2px;align-items:center}.pp .btn{padding:2px 8px}
.expense-summary{border:2px solid var(--dc);border-radius:14px;padding:14px 16px;margin:0 0 18px;background:var(--card)}
.expense-summary .total{margin:0;color:var(--ink);font-weight:400}
.expense-total-label{font-size:14px;color:var(--sub);margin-bottom:8px}
.expense-total-values{display:flex;flex-direction:column;align-items:flex-start;gap:4px;font-size:22px;line-height:1.3;color:var(--ink)}
.expense-total-values b{font-weight:700;overflow-wrap:anywhere}
.expense-currency-line{display:block}
.expense-zero{color:var(--sub);font-size:16px}
.expense-conversion{font-size:14px;color:var(--sub);margin-top:8px}
.ptot{display:block;margin:18px 0 0;font-size:14px;color:var(--ink)}
.ptot-head,.ptot-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.65fr) minmax(0,1.65fr);gap:8px;padding:9px 0;align-items:start}
.ptot-head{border-bottom:1px solid var(--line);color:var(--sub)}
.ptot-row{border-bottom:1px solid var(--line);font-size:14px;line-height:1.45}
.ptot-row:last-child{border-bottom:0;padding-bottom:0}
.ptot-row b{font-size:15px;overflow-wrap:anywhere}
.ptot-row span{min-width:0;overflow-wrap:anywhere}
.ptot-row small{display:block;color:var(--sub);font-size:13px;margin-top:3px}
@media(max-width:480px){.expense-summary{padding:12px}.expense-total-values{font-size:20px;gap:8px 14px}.ptot-head,.ptot-row{grid-template-columns:minmax(0,.9fr) minmax(0,1.4fr) minmax(0,1.4fr);gap:6px}.ptot-row{font-size:13px}.ptot-row b{font-size:14px}.ptot-row small{font-size:12px}}
.ro #newcat,.ro [data-addcat]{display:none}
.ov{position:fixed;inset:0;background:rgba(40,40,40,.35);display:flex;align-items:center;justify-content:center;z-index:20;padding:20px}.dlg{background:var(--card);border-radius:14px;padding:18px;max-width:360px;width:100%}.dlg p{margin:0 0 6px}
.meta.box{display:grid;grid-template-columns:1fr 1fr;gap:8px;border:2px solid var(--dc);border-radius:12px;padding:10px;background:var(--card);margin:2px 0 12px}
.meta.box label{display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--sub);min-width:0}.meta.box label:first-child{grid-column:1/-1}.meta.box input{width:100%;border-color:var(--line)}.dinfo{grid-column:1/-1;font-size:13px;color:var(--sub)}.dinfo:empty{display:none}
.mapf{width:100%;height:280px;border:2px solid var(--dc);border-radius:12px;margin:0 0 12px;background:var(--card)}.stops{flex:1 0 100%;display:flex;flex-wrap:wrap;gap:4px 10px;font-size:13px}
.thumb.lg{width:88px;height:88px}.thumb.big:not(:has(img)){width:auto;padding:0 10px;min-height:36px}.thumb.big img{max-height:260px}
.wr{align-items:flex-start}.wb{flex:1 1 160px;min-width:0;display:flex;flex-direction:column;gap:4px}.wl{display:flex;gap:6px}.wl .amt{width:84px;flex:none}
.ex>input[data-f="t"]{flex:1 1 140px;font-weight:600}
.fl .full.nw{flex-wrap:nowrap}.fl .full.nw>span{flex:none;color:var(--sub);font-size:14px}.fl .full.nw input[type=time]{flex:0 0 auto;width:auto}
.dchip{position:relative;width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:50%;cursor:pointer;font-size:14px;color:var(--ink)}.dchip:has(input:checked){background:var(--dc);border-color:var(--dc)}.dchip input{position:absolute;opacity:0;width:0;height:0;flex:none!important}
.gal{display:flex;flex-wrap:wrap;gap:6px;flex:1 0 100%}.gi{object-fit:cover;border-radius:8px;cursor:zoom-in}
.gi.s,.gadd.s{width:72px;height:72px}.gi.m,.gadd.m{width:88px;height:88px}.gi.l,.gadd.l{width:120px;height:120px}
.gadd{display:flex;align-items:center;justify-content:center;border:1px dashed var(--line);border-radius:8px;cursor:pointer;background:var(--ft);font-size:22px}.ro .gadd{display:none}
.zm{max-width:100%;text-align:center}.zm img{max-width:100%;max-height:78vh;border-radius:10px}.ov .bar{justify-content:center}
.btn.del.sm{font-size:12px;padding:0 6px;margin-left:auto}.vrow .vl{flex:1}
.row>input:not([type=checkbox]){flex:1 1 0;min-width:0;width:auto}.wl input[data-f="t"]{flex:1;min-width:0}
.ptot{display:block;margin:18px 0 0;font-size:14px;color:var(--ink)}
.fbox{border:2px solid var(--dc);border-radius:12px;background:var(--card);padding:12px 14px;margin-bottom:10px;font-size:14px;line-height:1.7}.cd{font-size:16px;margin-bottom:4px}.cd b{font-size:44px;line-height:1.1;margin-right:4px}
.mapsvg{margin:0 0 4px}.mapsvg svg{width:100%;height:auto;display:block}.mapph{padding:24px;text-align:center;color:var(--sub);font-size:14px;border:2px dashed var(--dc);border-radius:12px}
.sub{color:var(--sub);font-size:14px;margin:6px 0}
input[type=checkbox]{width:20px;height:20px;flex:none;accent-color:var(--acc)}
.row{list-style:none;display:flex;gap:6px;align-items:center;padding:4px 0;border-top:1px solid var(--line)}
.amt{text-align:right}.row .amt{width:96px;flex:none}
.ppl{display:flex;flex-wrap:wrap;gap:6px}.ppl input{width:7em;border-color:var(--line)}
.ex{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.ex>input:first-child{flex:1 1 140px;font-weight:600}.ex .amt{flex:0 0 110px}.ex .full{flex:1 0 100%;font-size:14px;color:var(--sub)}.ex select{width:auto;border-color:var(--line);background:var(--card)}
.chk{display:inline-flex;gap:4px;align-items:center;margin-right:8px}
.fx,.calc{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}.fx label,.calc label{display:flex;gap:6px;align-items:center}.fx input,.calc input{width:7em;border-color:var(--line)}
.ro input[data-keep]{border-color:var(--line)!important}.ro .btn.del,.ro [data-add]{display:none}
.thumb{flex:none;width:56px;height:56px;border-radius:8px;border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;background:var(--ft);font-size:18px}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb.big{width:100%;height:auto;min-height:44px;font-size:14px;color:var(--sub)}.thumb.big img{height:auto;object-fit:contain}
.ro .thumb:not(:has(img)){display:none}
.fl>select{flex:0 0 auto}.fl>input{flex:1 1 140px;font-weight:600}.fl .full{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.fl .full input{width:auto;flex:1 1 120px;min-width:0;border-color:var(--line)}
@media(max-width:420px){.item{grid-template-columns:84px 1fr}}

.leg{flex-wrap:nowrap;gap:4px;margin-left:0}.leg select{min-width:0;max-width:8em;font-size:14px;padding:3px 4px}.leg input{width:56px;flex:none}.leg a{flex:none;padding:3px 8px;text-decoration:none}.leg>*{flex-shrink:0}.leg select{flex-shrink:1}
.wl .amt,.row .amt{width:80px!important;flex:0 0 80px!important}.ex .amt{width:82px!important;flex:0 0 82px!important}.wl input[data-f="t"]{flex:1 1 0;min-width:0}
.meta.box input{min-width:0;max-width:100%;-webkit-appearance:none;appearance:none;height:40px}
#mapbar,#mapf,#mapsvg,#mapcap{display:none!important}

.wl .amt,.row .amt,.ex .amt{width:62px!important;flex:0 0 62px!important;font-size:14px;padding:6px 4px}
.wl select[data-f="cur"],.ex select[data-f="cur"]{width:64px!important;min-width:0;flex:0 0 64px;font-size:14px;padding:6px 2px}
.ex>input[data-f="t"]{flex:1 1 0!important;min-width:0}

.wl select[data-f="cur"],.ex select[data-f="cur"]{width:52px!important;flex:0 0 52px!important;font-size:13px!important;padding:6px 0 6px 4px!important}
.wish-summary{border:2px solid var(--dc);border-radius:12px;padding:14px;margin:0 0 14px;background:var(--card)}
.ws-title{font-size:14px;color:var(--sub);margin-bottom:8px}.ws-second{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.ws-currencies{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 18px}.ws-currency{display:inline-flex;align-items:baseline;gap:8px;border:0;border-radius:0;padding:0;min-width:0;max-width:100%;background:transparent;flex-wrap:wrap}
.ws-currency span{font-size:14px;color:var(--sub);font-weight:600}.ws-currency b{font-size:22px;line-height:1.25;letter-spacing:-.3px;overflow-wrap:anywhere;color:var(--ink)}.ws-currency small{font-size:12px;color:var(--sub)}.ws-conversion{width:100%;font-size:13px;color:var(--sub);margin-top:4px}.ws-empty{font-size:14px;color:var(--sub)}
@media(max-width:480px){.ws-currency{gap:6px}.ws-currency b{font-size:20px}.ws-title{font-size:13px}.wish-summary{padding:12px}}
.wvrow{flex:1 0 100%;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--sub);padding-left:26px}.wvrow .wvlabel{flex:1;min-width:120px}.wvrow button[aria-pressed="true"]{border-color:var(--dc);background:color-mix(in srgb,var(--dc) 20%,white);color:var(--ink);font-weight:700}
/* Wishlist totals: compact layout matching the reference */
#wish-summary{background:var(--card);border:2px solid var(--dc);border-radius:14px;padding:14px 16px;margin:0 0 14px}
#wish-summary .ws-currencies{display:flex!important;flex-direction:row!important;flex-wrap:wrap!important;align-items:baseline;gap:8px 22px}
#wish-summary .ws-currency{display:inline-flex!important;flex:0 1 auto!important;width:auto!important;align-items:baseline;gap:7px;padding:0;background:transparent;border:0;min-width:0}
#wish-summary .ws-currency span{font-size:14px;color:var(--sub);font-weight:600}
#wish-summary .ws-currency b{font-size:22px;line-height:1.2;letter-spacing:-.35px;color:var(--ink)}
#wish-summary .ws-conversion{display:block;width:100%;font-size:13px;color:var(--sub);margin:4px 0 0}
#wish-summary .ws-second{border-top:1px solid var(--line);padding-top:12px;margin-top:14px}
#wish-summary .ws-empty{font-size:13px;color:var(--sub)}
@media(max-width:480px){#wish-summary{padding:12px}#wish-summary .ws-currencies{gap:8px 16px}#wish-summary .ws-currency b{font-size:20px}}

</style>
</head>
<body>
<main class="">
  <input id="trip" class="title" placeholder="旅行名稱" aria-label="旅行名稱">
  <div id="mapbar" class="mapbar" style=""></div>
  <div id="mapsvg" class="mapsvg" style=""></div>
  <div id="mapcap" class="sub" style=""></div>
  <div id="nav" class="tabs" role="tablist"><button class="tab" role="tab" aria-selected="true" data-v="plan">行程</button><button class="tab" role="tab" aria-selected="false" data-v="flt">機票</button><button class="tab" role="tab" aria-selected="false" data-v="dine">餐廳</button><button class="tab" role="tab" aria-selected="false" data-v="pack">行李</button><button class="tab" role="tab" aria-selected="false" data-v="wish">願望</button><button class="tab" role="tab" aria-selected="false" data-v="exp">旅費</button><button class="tab" role="tab" aria-selected="false" data-v="fx">匯率</button></div>
  <div class="meta box" style=""><label>目的地<input id="dest" placeholder="例如：沖繩"></label><label>出發日<input id="start" type="date"></label><label>回國日<input id="end" type="date"></label><div id="dinfo" class="dinfo"></div></div>
  <div id="tabs" class="tabs" role="tablist" style=""></div>
  <section id="day" class="day" style=""></section>
  <section id="oth" class="day" style="display: none;"><div class="fx"><label>外幣<input data-fx="fc" value="JPY" maxlength="3"></label><label>本國幣<input data-fx="hc" value="TWD" maxlength="3"></label><label>1 JPY =<input type="number" step="any" data-fx="rate" value="0.21" placeholder="例如 0.21"> TWD</label></div><div class="calc"><label>JPY<input type="number" step="any" id="cf" data-keep="1" placeholder="0"></label><span>⇄</span><label>TWD<input type="number" step="any" id="ch" data-keep="1" placeholder="0"></label></div><p class="sub">其他幣別匯率（1 單位外幣 = 多少 TWD）</p><div class="ppl"><input id="newrt" maxlength="3" placeholder="例如 USD"><button class="btn" data-addrt="1">＋ 幣別</button></div><p class="sub">這個頁面無法自動取得即時匯率，請先查好再填入上方。 <a class="btn" target="_blank" rel="noopener" data-fxlink="1">查詢今日匯率</a></p></section>
  <div class="foot">
    <button class="btn main" id="pub" hidden="">發布更新給同行的人</button>
    <button class="btn" id="copy">複製全部內容</button>
    <button class="btn danger" id="reset">清除全部</button>
    <span id="msg" aria-live="polite"></span>

<script>
const KEY='trip-planner-v1';
const uid=()=>Math.random().toString(36).slice(2,9);
const blank=()=>({title:'',start:'',cur:0,days:[{name:'',items:[]}]});
let S=blank(),RO=false;
const okS=p=>p&&Array.isArray(p.days)&&p.days.length;
try{const p=JSON.parse(document.getElementById('data').textContent||'null');if(okS(p))S=p}catch(e){}
const save=()=>{if(RO)return;if(SYNC){schedFlush();return}try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){flash('瀏覽器儲存空間不足，請減少圖片')}};
function applyRO(){
  document.querySelector('main').classList.toggle('ro',RO);
  document.querySelectorAll('main input,main textarea,main select').forEach(x=>x.disabled=RO&&!x.hasAttribute('data-keep'));
}
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const WD=['日','一','二','三','四','五','六'];
function dateOf(i){
  if(!S.start)return '';
  const d=new Date(S.start+'T00:00:00');if(isNaN(d))return '';
  d.setDate(d.getDate()+i);
  return (d.getMonth()+1)+'/'+d.getDate()+'（'+WD[d.getDay()]+'）';
}
function flash(t){const m=$('msg');m.textContent=t;setTimeout(()=>m.textContent='',2000)}
function render(){
  norm();renderNav();$('trip').value=S.title;
  const P=V==='plan';
  [document.querySelector('.meta'),$('tabs'),$('day'),$('mapbar'),$('mapsvg'),$('mapcap')].forEach(x=>x.style.display=P?'':'none');
  $('oth').style.display=P?'none':'';
  if(!P){setDC(SECC[V]);renderOther();return}
  if(S.cur>=S.days.length)S.cur=S.days.length-1;
  renderMap();setDC(DAYC[S.cur%DAYC.length]);
  $('trip').value=S.title;$('start').value=S.start;$('end').value=S.end||'';$('dest').value=S.dest||'';dinfo();
  $('tabs').innerHTML=S.days.map((d,i)=>`<button class="tab" role="tab" aria-selected="${i===S.cur}" data-tab="${i}" style="--c:${DAYC[i%DAYC.length]}">第 ${i+1} 天<small>${esc(dateOf(i)||'未設日期')}</small></button>`).join('')+'<button class="tab add" data-add="1">＋ 新增一天</button>';
  const d=S.days[S.cur],n=d.items.length;
  $('day').innerHTML=`<div class="dayhead"><b>第 ${S.cur+1} 天</b><input data-f="dayname" value="${esc(d.name)}" placeholder="這天的主題，例如：市區散步" aria-label="當天主題"></div>
  ${n?'':'<div class="empty">這天還沒有行程，按下方「新增行程」開始安排。</div>'}
  <ul class="items">${d.items.map((it,i)=>`<li class="item" data-i="${i}">
    <input class="time" type="time" data-f="time" value="${esc(it.time)}" aria-label="時間">
    <input class="name" data-f="name" value="${esc(it.name)}" placeholder="要做什麼？" aria-label="行程">
    <div class="pw"><input class="place" data-f="place" value="${esc(it.place)}" placeholder="地點" aria-label="地點"><a class="btn" target="_blank" rel="noopener" data-map="${i}">地圖</a></div>
    <textarea class="full" data-f="note" placeholder="備註（交通、預約、花費…）" aria-label="備註">${esc(it.note)}</textarea>
    <div class="tools"><button class="btn" data-a="up" ${i===0?'disabled':''}>上移</button><button class="btn" data-a="down" ${i===n-1?'disabled':''}>下移</button><button class="btn del" data-a="del">刪除</button></div>
  </li>${i<n-1?legHtml(it,i):''}`).join('')}</ul><div class="total">${totalText(d)}</div>
  <div class="bar"><button class="btn main" data-a="add">＋ 新增行程</button><button class="btn" data-a="sort">依時間排序</button>
  <button class="btn" data-a="dup">複製這天</button><button class="btn danger" data-a="delday" ${S.days.length<2?'disabled':''}>刪除這天</button></div>`;
  applyRO();
}
const MODES={walking:'🚶 步行',transit:'🚇 大眾運輸',driving:'🚗 開車'};
const MN={walking:'步行',transit:'大眾運輸',driving:'開車'};
const q=s=>encodeURIComponent((s||'').trim()+(S.dest?' '+S.dest:''));
function linkFor(a){
  const d=S.days[S.cur];
  if(a.dataset.map!==undefined){const p=d.items[+a.dataset.map]?.place;return p&&p.trim()?'https://www.google.com/maps/search/?api=1&query='+q(p):''}
  const i=+a.dataset.nav,x=d.items[i],y=d.items[i+1];
  if(!x||!y||!x.place?.trim()||!y.place?.trim())return '';
  return 'https://www.google.com/maps/dir/?api=1&origin='+q(x.place)+'&destination='+q(y.place)+'&travelmode='+(x.mode||'transit');

async function moveImgs(g){
  for(const k of GROUPS[g]){const L=S[k];if(!Array.isArray(L))continue;
    for(const o of L){if(!o||!Array.isArray(o.imgs))continue;
      for(let j=0;j<o.imgs.length;j++){let u=o.imgs[j];
        if(u&&u.startsWith('data:')){
          if(u.length>170000)u=await shrinkImg(u);
          const id=uid();
          try{if(!u)throw 0;await DB.doc('img/'+id).set({d:u});IMG[id]=u;o.imgs[j]=id}catch(e){o.imgs.splice(j,1);j--;flash('有一張照片無法同步，已略過',4000)}}}}}
}
async function flush(){
  if(!DB||RO)return;
  for(const g of Object.keys(GROUPS)){
    await moveImgs(g);
    const c=canon(pickG(g));
    if(c===LAST[g])continue;
    LAST[g]=c;
    try{const body=JSON.parse(JSON.stringify({d:pickG(g),by:UID,t:Date.now()}));await DB.doc('trip/'+g).set(body)}catch(e){LAST[g]=undefined;flash('同步失敗：'+g+'（'+((e&&e.code)||'未知原因')+'，約 '+Math.round(JSON.stringify(pickG(g)).length/1024)+' KB）',6000)}
  }
}
function deferRender(){const a=document.activeElement;if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&!a.disabled){a.addEventListener('blur',()=>setTimeout(render,80),{once:true});return}render()}
function startSync(){
  SYNC=true;let first=true;
  DB.collection('img').onSnapshot(s=>{let ch=false;s.docs.forEach(d=>{const x=d.data()||{};if(x.d&&IMG[d.id]!==x.d){IMG[d.id]=x.d;ch=true}});if(ch)paintImgs()},()=>{});
  DB.collection('trip').onSnapshot(s=>{
    const got={};s.docs.forEach(d=>{got[d.id]=d.data()||{}});
    let ch=false;
    for(const g of Object.keys(GROUPS)){const x=got[g];if(!x||!x.d)continue;
      if(canon(x.d)===LAST[g])continue;
      if(!RO&&LAST[g]!==undefined&&canon(pickG(g))!==LAST[g])continue;
      Object.assign(S,x.d);LAST[g]=canon(pickG(g));ch=true}
    if(ch)deferRender();
    if(first){first=false;if(!RO)schedFlush()}
  },()=>{flash('無法連線到雲端同步',4000)});
}

function allText(){
  const M={walking:'步行',transit:'大眾運輸',driving:'開車'},L=[];
  L.push(S.title||'旅行行程');
  L.push('目的地：'+(S.dest||'')+'　出發日：'+(S.start||'')+'　回國日：'+(S.end||''));
  L.push('');L.push('【行程】');
  S.days.forEach((d,i)=>{
    L.push('第 '+(i+1)+' 天 '+dateOf(i)+(d.name?' '+d.name:''));
    d.items.forEach((it,k)=>{
      L.push('  '+(it.time||'--:--')+' '+(it.name||'')+(it.place&&it.place!==it.name?'（'+it.place+'）':'')+(it.note?'　'+it.note:''));
      if(k<d.items.length-1&&it.min!==''&&it.min!==undefined)L.push('      ↓ '+(M[it.mode]||'')+' 約 '+it.min+' 分鐘');
    });
    L.push('');
  });
  L.push('【機票】');
  (S.flt||[]).forEach(o=>L.push((o.dir==='ret'?'回程 ':'去程 ')+(o.no||'')+'　'+(o.from||'')+' → '+(o.to||'')+'　起飛 '+(o.dep||'').replace('T',' ')+'　抵達 '+(o.arr||'').replace('T',' ')+(o.pnr?'　訂位代號 '+o.pnr:'')+(o.note?'　'+o.note:'')));
  L.push('');L.push('【備選餐廳】');
  (S.dine||[]).forEach(o=>L.push('・'+(o.name||'')+'（'+(o.cat||'')+'）'+(o.addr?' 地址：'+o.addr:'')+(o.open||o.close?' 營業 '+(o.open||'?')+'–'+(o.close||'?'):'')+((o.off||[]).length?' 公休：週'+o.off.map(j=>WD[j]).join('、'):'')+(o.note?' '+o.note:'')));
  L.push('');L.push('【行李】');
  const C=S.packCats||[];
  [...C,''].forEach(c=>{const A=(S.pack||[]).filter(o=>c===''?!C.includes(o.cat):o.cat===c);if(!A.length)return;L.push((c||'未分類')+'：');A.forEach(o=>L.push('  '+(o.done?'[x] ':'[ ] ')+(o.t||'')))});
  L.push('');L.push('【願望清單】');
  (S.wish||[]).forEach(o=>L.push((o.done?'[x] ':'[ ] ')+(o.t||'')+(o.price?'　'+o.price+' '+(o.cur||S.fc):'')+(o.cat?'　'+o.cat:'')+(o.note?'　'+o.note:'')));
  L.push('');L.push('【旅費】');
  const c=expCalc();
  L.push('總支出 '+f2(c.tot)+' '+c.unit);
  S.people.forEach((p,i)=>L.push('  '+p+'：已付 '+f2(c.paid[i])+'　應分攤 '+f2(c.owed[i])));
  (S.exp||[]).forEach(o=>L.push('・'+(o.t||'')+'　'+(o.amt||0)+' '+(o.cur||S.fc)+'　付款：'+(S.people[+o.who]||'')+'　分攤：'+(o.split||[]).map(j=>S.people[j]).filter(Boolean).join('、')));
  return L.join('\n');
}
$('copy').onclick=async()=>{
  const t=allText();
  try{await navigator.clipboard.writeText(t);flash('已複製全部內容，可以貼到 Google 文件')}
  catch(e){
    const o=document.createElement('div');o.className='ov';
    o.innerHTML='<div class="dlg"><p>無法自動複製，請長按全選後複製：</p><textarea style="width:100%;height:50vh;font-size:13px"></textarea><div class="bar"><button class="btn main">關閉</button></div></div>';
    o.querySelector('textarea').value=t;
    o.onclick=ev=>{if(ev.target.closest('button')||ev.target===o)o.remove()};
    document.body.appendChild(o);o.querySelector('textarea').select();
  }
};
